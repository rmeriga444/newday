version: 2

models:

  - name: revenue_by_category_monthly
    description: "Total revenue by product category for each month. Q1."
    tests:
      - model_freshness:
          column_name: load_ts
          warn_after_hours: 24
          error_after_hours: 48
    columns:
      - name: order_month
        tests: [not_null]
      - name: category_name
        tests: [not_null]
      - name: total_revenue
        tests: [not_null, assert_positive_amount]
      - name: total_orders
        tests: [not_null]
      - name: load_ts
        tests: [not_null]

  - name: revenue_edge_cases
    description: "Monthly revenue by category and payment method with zero-quantity handling and % split. Q2."
    columns:
      - name: order_month
        tests: [not_null]
      - name: category_name
        tests: [not_null]
      - name: payment_method
        tests: [not_null]
      - name: pct_revenue_by_payment
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: load_ts
        tests: [not_null]

  - name: customer_segments
    description: "Customer tiers based on total purchase amount with customer names and order counts. Q3."
    tests:
      - assert_grain_is_unique:
          grain_columns:
            - customer_id
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_name
        tests: [not_null]
      - name: customer_tier
        tests:
          - not_null
          - accepted_values:
              values: ['High Value', 'Medium Value', 'Low Value']
      - name: total_orders
        tests: [not_null]
      - name: total_purchase_amount
        tests: [not_null]
      - name: load_ts
        tests: [not_null]

  - name: payment_analysis
    description: "Revenue, AOV, order count, and percentage distribution by payment method. Q4."
    columns:
      - name: payment_method
        tests: [unique, not_null]
      - name: total_revenue
        tests: [not_null, assert_positive_amount]
      - name: avg_order_value
        tests: [not_null]
      - name: total_orders
        tests: [not_null]
      - name: pct_of_total_revenue
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: load_ts
        tests: [not_null]

  - name: flagged_orders
    description: "Orders where discount_applied > 30% or shipping_cost > 10% of order_amount. Nulls treated as zero. Q5."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_date
        tests: [not_null]
      - name: order_amount
        tests: [not_null, assert_positive_amount]
      - name: discount_applied
        tests: [not_null]
      - name: shipping_cost
        tests: [not_null]
      - name: load_ts
        tests: [not_null]

  - name: seasonal_patterns
    description: "Monthly sales by category with QoQ growth, best/worst months, and coefficient of variation. Q6."
    tests:
      - assert_grain_is_unique:
          grain_columns:
            - category_name
            - order_month
    columns:
      - name: category_name
        tests: [not_null]
      - name: order_month
        tests: [not_null]
      - name: monthly_revenue
        tests: [not_null]
      - name: coefficient_of_variation
        tests: [not_null]
      - name: is_best_month
        tests: [not_null]
      - name: is_worst_month
        tests: [not_null]
      - name: load_ts
        tests: [not_null]

  - name: daily_revenue
    description: "Daily revenue totals filtered by date range macro. Returns empty table when no data in range. Q7."
    columns:
      - name: order_date
        tests: [unique, not_null]
      - name: total_revenue
        tests: [not_null]
      - name: total_orders
        tests: [not_null]
      - name: load_ts
        tests: [not_null]
