version: 2

models:
  - name: raw_sales_fact
    description: "Bronze view of raw sales transactions."
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_amount
        tests: [not_null]
      - name: payment_method
        tests: [not_null]
      - name: load_ts
        tests: [not_null]

  - name: raw_customers
    description: "Bronze view of raw customer records."
    columns:
      - name: customer_id
        tests: [not_null]
      - name: load_ts
        tests: [not_null]

  - name: raw_products
    description: "Bronze view of raw product master."
    columns:
      - name: product_id
        tests: [not_null]
      - name: load_ts
        tests: [not_null]

  - name: raw_product_category
    description: "Bronze view of raw product category enrichment."
    columns:
      - name: product_id
        tests: [not_null]
      - name: load_ts
        tests: [not_null]
