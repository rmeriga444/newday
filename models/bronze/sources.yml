version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'NEWDAY_DEV') }}"
    schema: RAW
    description: "Raw source tables loaded from CSV files into Snowflake."

    tables:
      - name: sales_fact
        description: "One row per order line item."
        columns:
          - name: order_id
            tests: [unique, not_null]
          - name: product_id
            tests: [not_null]
          - name: customer_id
            tests: [not_null]
          - name: order_date
            tests: [not_null]
          - name: order_amount
            tests: [not_null]
          - name: payment_method
            tests:
              - not_null
              - accepted_values:
                  values: ['credit_card', 'debit_card', 'paypal', 'bank_transfer']

      - name: customer
        description: "Customer master."
        columns:
          - name: customer_id
            tests: [unique, not_null]
          - name: customer_email
            tests: [not_null, unique]
          - name: status
            tests:
              - accepted_values:
                  values: ['active', 'cancelled']

      - name: product
        description: "Product master."
        columns:
          - name: product_id
            tests: [unique, not_null]

      - name: product_category
        description: "Product enrichment including pricing, margin, and stock levels."
        columns:
          - name: product_id
            tests: [unique, not_null]
          - name: category_name
            tests:
              - accepted_values:
                  values: ['Electronics', 'Clothing', 'Home & Garden', 'Sports', 'Books']
